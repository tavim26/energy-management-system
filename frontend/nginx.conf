server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Client-side routes (/admin/users, /dashboard...) have no file on disk,
    # so they are answered with index.html and handled by React Router
    location / {
        try_files $uri $uri/ /index.html;
    }

    # File names of built assets contain a content hash, so they can be cached for a long time
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}