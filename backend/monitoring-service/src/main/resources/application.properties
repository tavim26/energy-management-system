spring.application.name=monitoring-service

# Server
server.port=8084

# Database
spring.datasource.url=jdbc:postgresql://monitoring-db:5432/monitoring_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha


# RabbitMQ - Data Collection Broker
spring.rabbitmq.data.host=${SPRING_RABBITMQ_DATA_HOST:localhost}
spring.rabbitmq.data.port=${SPRING_RABBITMQ_DATA_PORT:5672}
spring.rabbitmq.data.username=guest
spring.rabbitmq.data.password=guest

# RabbitMQ - Synchronization Broker
spring.rabbitmq.sync.host=${SPRING_RABBITMQ_SYNC_HOST:localhost}
spring.rabbitmq.sync.port=${SPRING_RABBITMQ_SYNC_PORT:5673}
spring.rabbitmq.sync.username=guest
spring.rabbitmq.sync.password=guest

# Queue names
rabbitmq.queue.data=device-data-queue
rabbitmq.queue.sync=sync-queue-monitoring