spring.application.name=monitoring-service
server.port=8084

# Database
spring.datasource.url=jdbc:postgresql://${DB_IP:localhost}:${DB_PORT:5432}/${DB_DBNAME:monitoring_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# RabbitMQ data broker (measurements from the device simulator)
spring.rabbitmq.data.host=${SPRING_RABBITMQ_DATA_HOST:localhost}
spring.rabbitmq.data.port=${SPRING_RABBITMQ_DATA_PORT:5672}
spring.rabbitmq.data.username=${SPRING_RABBITMQ_DATA_USERNAME:guest}
spring.rabbitmq.data.password=${SPRING_RABBITMQ_DATA_PASSWORD:guest}

# RabbitMQ sync broker (device events and overconsumption alerts)
spring.rabbitmq.sync.host=${SPRING_RABBITMQ_SYNC_HOST:localhost}
spring.rabbitmq.sync.port=${SPRING_RABBITMQ_SYNC_PORT:5673}
spring.rabbitmq.sync.username=${SPRING_RABBITMQ_SYNC_USERNAME:guest}
spring.rabbitmq.sync.password=${SPRING_RABBITMQ_SYNC_PASSWORD:guest}

# Queues
rabbitmq.queue.data=device-data-queue
rabbitmq.queue.sync=sync-queue-monitoring
rabbitmq.queue.notifications=notifications-queue