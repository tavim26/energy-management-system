# Server Configuration
spring.application.name=device-management
server.port=8082

# Database Configuration - uses environment variables
spring.datasource.url=jdbc:postgresql://${DB_IP:localhost}:${DB_PORT:5432}/${DB_DBNAME:device_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Logging
logging.level.org.springframework.web=INFO
logging.level.org.hibernate=INFO

# User Service Configuration
user.service.url=${USER_SERVICE_URL:http://localhost:8081}

# Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha



# RabbitMQ Sync Broker Configuration

# Sync Broker connection
spring.rabbitmq.sync.host=${RABBITMQ_SYNC_HOST:localhost}
spring.rabbitmq.sync.port=${RABBITMQ_SYNC_PORT:5673}
spring.rabbitmq.sync.username=${RABBITMQ_SYNC_USERNAME:guest}
spring.rabbitmq.sync.password=${RABBITMQ_SYNC_PASSWORD:guest}

# Sync Queue name
rabbitmq.exchange.sync=sync-exchange