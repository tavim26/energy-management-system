spring.application.name=device-management
server.port=8082

# Database
spring.datasource.url=jdbc:postgresql://${DB_IP:localhost}:${DB_PORT:5432}/${DB_DBNAME:device_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Swagger / OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# RabbitMQ sync broker
spring.rabbitmq.sync.host=${RABBITMQ_SYNC_HOST:localhost}
spring.rabbitmq.sync.port=${RABBITMQ_SYNC_PORT:5673}
spring.rabbitmq.sync.username=${RABBITMQ_SYNC_USERNAME:guest}
spring.rabbitmq.sync.password=${RABBITMQ_SYNC_PASSWORD:guest}
rabbitmq.exchange.sync=sync-exchange