# Server Configuration
spring.application.name=api-gateway
server.port=8080

# Microservices URLs - uses environment variables for Docker compatibility
service.auth.url=${AUTH_SERVICE_URL:http://localhost:8083}
service.user.url=${USER_SERVICE_URL:http://localhost:8081}
service.device.url=${DEVICE_SERVICE_URL:http://localhost:8082}
service.support.url=${SUPPORT_SERVICE_URL:http://localhost:8086}
service.websocket.url=${WEBSOCKET_SERVICE_URL:ws://localhost:8085}
# JWT Configuration
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidation12345

# Logging
logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.org.springframework.web=INFO