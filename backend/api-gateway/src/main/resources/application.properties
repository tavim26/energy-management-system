spring.application.name=api-gateway
server.port=8080

# Microservices
service.auth.url=${AUTH_SERVICE_URL:http://localhost:8083}
service.user.url=${USER_SERVICE_URL:http://localhost:8081}
service.device.url=${DEVICE_SERVICE_URL:http://localhost:8082}
service.support.url=${SUPPORT_SERVICE_URL:http://localhost:8086}
service.websocket.url=${WEBSOCKET_SERVICE_URL:http://localhost:8085}

# Origins allowed to call the gateway from the browser (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Must be the same secret as in the Authorization Service
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidation12345