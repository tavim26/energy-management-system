# Id of the device the measurements belong to (shown on the Devices page of the application)
device.id=1

# RabbitMQ data broker started by docker-compose
rabbitmq.host=localhost
rabbitmq.port=5672
rabbitmq.username=guest
rabbitmq.password=guest
rabbitmq.queue.name=device-data-queue

# Minutes between two measurements in normal mode.
# The Monitoring Service converts each measurement to energy assuming 10 minutes.
simulator.interval.minutes=10

# Average power of the device, in watts; readings vary around it during the day
simulator.base.load=1500